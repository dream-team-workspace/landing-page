function useRevealOnScroll() {
  React.useEffect(() => {
    const nodes = Array.from(document.querySelectorAll<HTMLElement>(".reveal, .statement"));
    if (!("IntersectionObserver" in window)) {
      nodes.forEach((n) => n.classList.add("in"));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: "0px 0px -12% 0px", threshold: 0.12 });
    nodes.forEach((n) => io.observe(n));
    return () => io.disconnect();
  }, []);
}

function useStickyNav() {
  const [solid, setSolid] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setSolid(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return solid;
}

/** Native horizontal scroller with arrow controls; position is remembered. */
function useScroller(storageKey: string) {
  const ref = React.useRef<HTMLDivElement | null>(null);
  const [page, setPage] = React.useState(0);
  const [pages, setPages] = React.useState(1);

  const measure = React.useCallback(() => {
    const el = ref.current;
    if (!el) return;
    const size = el.clientWidth || 1;
    const total = Math.max(1, Math.round(el.scrollWidth / size));
    setPages(total);
    setPage(Math.min(total - 1, Math.round(el.scrollLeft / size)));
  }, []);

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    measure();
    const saved = Number(window.localStorage.getItem(storageKey) || "0");
    if (saved > 0) el.scrollLeft = saved * (el.clientWidth || 1);
    const onScroll = () => {
      const size = el.clientWidth || 1;
      const idx = Math.round(el.scrollLeft / size);
      setPage(idx);
      window.localStorage.setItem(storageKey, String(idx));
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", measure);
    return () => {
      el.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", measure);
    };
  }, [measure, storageKey]);

  const go = (dir: number) => {
    const el = ref.current;
    if (!el) return;
    const next = Math.min(pages - 1, Math.max(0, page + dir));
    el.scrollTo({ left: next * (el.clientWidth || 1), behavior: "smooth" });
  };

  return { ref, page, pages, go };
}

function useAnchors() {
  return (e: React.MouseEvent, id: string) => {
    const el = document.getElementById(id);
    if (!el) return;
    e.preventDefault();
    const top = el.getBoundingClientRect().top + window.scrollY - 84;
    window.scrollTo({ top, behavior: "smooth" });
  };
}

function Studio() {
  const words = "We build AI-driven, local-friendly mobile applications for Android and iOS — software that runs on your device, not in a data centre.".split(" ");
  const ref = React.useRef<HTMLElement | null>(null);

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        el.querySelectorAll<HTMLElement>(".w").forEach((w, i) => {
          w.style.transitionDelay = Math.min(i * 34, 900) + "ms";
        });
        el.classList.add("in");
        io.disconnect();
      });
    }, { threshold: 0.35 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <section className="sec" id="studio" ref={ref as React.RefObject<HTMLElement>} data-od-id="studio">
      <div className="wrap">
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 26 }}>
          <span className="sec-badge" data-od-id="studio-badge"><b>001</b><i />Who we are</span>
          <p className="statement" data-od-id="studio-statement">
            {words.map((w, i) => <span className="w" key={w + i}>{w}{" "}</span>)}
          </p>
        </div>
      </div>
    </section>
  );
}

                <button className="faq-q" aria-expanded={isOpen} onClick={() => setOpen(isOpen ? -1 : i)}>
                  <span className="faq-n">{i + 1}</span>
                  <span className="h4">{f.q}</span>
                  <span className="faq-sign"><IcoPlus size={16} /></span>
                </button>
                <div className="faq-a"><div><p>{f.a}</p></div></div>
              </div>
            );
          })}
        </div>

        <div className="faq-more reveal">
          <p className="small">Have any other questions?</p>
          <a className="btn btn-quiet" href="#contact" data-od-id="faq-contact" onClick={(e) => goto(e, "contact")}>
            Contact us <IcoArrowR size={16} />
          </a>
        </div>
      </div>
    </section>
  );
}

function Contact() {
  const [values, setValues] = React.useState({ name: "", email: "", company: "", brief: "" });
  const [errors, setErrors] = React.useState<Record<string, string>>({});
  const [sent, setSent] = React.useState(false);

  const set = (k: string) => (e: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement>) =>
    setValues((v) => ({ ...v, [k]: e.target.value }));

  const submit = (e: React.FormEvent) => {
    e.preventDefault();
    const next: Record<string, string> = {};
    if (!values.name.trim()) next.name = "Please add your name.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(values.email.trim())) next.email = "Please add a valid email address.";
    if (values.brief.trim().length < 12) next.brief = "Tell us a little more — a sentence is enough.";
    setErrors(next);
    if (Object.keys(next).length === 0) setSent(true);
  };

  return (
    <section className="sec contact-sec" id="contact" data-od-id="contact">
      <div className="contact-veil" aria-hidden="true" />
      <div className="wrap" style={{ position: "relative" }}>
        <div className="contact-card reveal">
          <span className="contact-orb"><IcoSpark size={26} /></span>
          <div>
            <h2 className="h2" style={{ fontSize: "clamp(28px, 3.4vw, 44px)" }} data-od-id="contact-title">
              Your next app should<br />run on the phone.
            </h2>
            <p className="small" style={{ marginTop: 14, maxWidth: 420, marginLeft: "auto", marginRight: "auto" }}>
              Tell us what the model needs to do. We will tell you what fits on a device.
            </p>
          </div>

          {sent ? (
            <div className="form-ok" role="status" data-od-id="contact-success">
              <IcoCheck size={22} />
              <h3 className="h4">That is in.</h3>
              <p className="small" style={{ margin: 0 }}>Thanks {values.name.split(" ")[0] || "there"} — we will reply from the studio within two working days.</p>
            </div>
          ) : (
            <form className="form" onSubmit={submit} noValidate>
              <div className="field">
                <label className="sr" htmlFor="f-name">Your name</label>
                <input id="f-name" placeholder="Your name*" value={values.name} onChange={set("name")}
                       aria-invalid={!!errors.name} data-od-id="field-name" />
                {errors.name ? <span className="field-err">{errors.name}</span> : null}
              </div>
              <div className="field">
                <label className="sr" htmlFor="f-email">Your email</label>
                <input id="f-email" type="email" placeholder="Your email*" value={values.email} onChange={set("email")}
                       aria-invalid={!!errors.email} data-od-id="field-email" />
                {errors.email ? <span className="field-err">{errors.email}</span> : null}
              </div>
              <div className="field">
                <label className="sr" htmlFor="f-company">Company</label>
                <input id="f-company" placeholder="Company" value={values.company} onChange={set("company")} data-od-id="field-company" />
              </div>
              <div className="field">
                <label className="sr" htmlFor="f-brief">What should the app do?</label>
                <textarea id="f-brief" placeholder="What should the app do?*" value={values.brief} onChange={set("brief")}
                          aria-invalid={!!errors.brief} data-od-id="field-brief" />
                {errors.brief ? <span className="field-err">{errors.brief}</span> : null}
              </div>
              <button className="btn btn-primary" type="submit" data-od-id="contact-submit">
                Send your request <IcoArrowR size={16} />
              </button>
              <p className="form-note">We read every message ourselves. No sales sequence, no drip campaign.</p>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}

function Footer() {
  const goto = useAnchors();
  const cols = [
    { label: "MemeChat AI", href: "https://memechat.dream-team.works" },
    { label: "Zeta AI Assistant", href: "https://zeta.dream-team.works" },
    { label: "CoBatik", href: "https://cobatik.dream-team.works" }
  ];

  return (
    <footer className="footer" data-od-id="footer">
      <div className="footer-veil" aria-hidden="true" />
      <div className="wrap footer-inner">
        <div className="footer-top">
          {cols.map((c) => (
            <a className="social" key={c.label} href={c.href} target="_blank" rel="noopener noreferrer" data-od-id={"footer-" + c.label.replace(/\s+/g, "-").toLowerCase()}>
              <i><IcoSpark size={16} /></i>
              <span style={{ flex: 1 }}>{c.label}</span>
              <IcoArrowR size={16} />
            </a>
          ))}
          <a className="social" href="https://dream-team.works" target="_blank" rel="noopener noreferrer" data-od-id="footer-studio">
            <i><IcoGlobe size={16} /></i>
            <span style={{ flex: 1 }}>dream-team.works</span>
            <IcoArrowR size={16} />
          </a>
        </div>

        <div className="footer-links">
          {[["studio", "Studio"], ["apps", "Capabilities"], ["work", "Work"], ["process", "Process"], ["download", "Download"], ["faq", "FAQ"], ["contact", "Contact"]].map(([id, label]) => (
            <a key={id} href={"#" + id} onClick={(e) => goto(e, id)}>{label}</a>
          ))}
        </div>

        <div className="wordmark" aria-hidden="true">Dream Team</div>

        <div className="footer-bottom">
          <span className="small">© Dream Team 2026</span>
          <a className="small" href="#home" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }}>Back to top</a>
        </div>
      </div>
    </footer>
  );
}

function App() {
  useRevealOnScroll();
  return (
    <React.Fragment>
      <Nav />
      <main>
        <Hero />
        <Studio />
        <StatsBand />
        <Values />
        <Stack />
        <Process />
        <Cases />
        <Tech />
        <InsideApps />
        <GetApps />
        <Beliefs />
        <Faq />
        <Contact />
      </main>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root") as HTMLElement).render(<App />);
</script>
</body>
